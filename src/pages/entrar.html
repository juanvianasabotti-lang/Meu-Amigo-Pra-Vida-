<!--meta title="Entrar" description="Acesse sua conta no Meu Amigo pra Vida." script="auth" robots="noindex,follow" -->
<section class="container auth-wrap" data-auth="entrar">
  <aside class="poster poster-v azul" aria-hidden="true" data-poster data-depth-area>
    <div class="poster-bg"><span class="poster-word" data-drift>oi!</span></div>
    <div class="poster-copy">
      <span class="eyebrow">Sua conta</span>
      <h2>Que bom te ver de novo</h2>
      <ul class="poster-list">
        <li>Seus pedidos de adoção e cada etapa</li>
        <li>Animais favoritos salvos</li>
        <li>Seus anúncios e mensagens</li>
      </ul>
    </div>
    <div class="poster-art"><img class="poster-pet" src="/assets/img/animais/labrador.webp" alt="" width="1037" height="1400" data-pet></div>
  </aside>
  <div class="auth-card" data-reveal="up">
    <h1>Entrar</h1>
    <p class="muted">Acesse para acompanhar pedidos, favoritos e anúncios.</p>
    <div class="notice hidden mb-2" data-msg></div>
    <div class="hidden" data-google-area>
      <button class="btn google-btn btn-block" type="button" data-google><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continuar com o Google</button>
      <div class="divider" style="margin:18px 0">ou com e-mail</div>
    </div>
    <form class="form" novalidate data-form>
      <div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Senha</label>
        <div class="password-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-label="Mostrar senha" data-toggle-pass></button></div></div>
      <div class="flex justify-between wrap gap-1 small"><a class="link" href="/recuperar-senha">Esqueci minha senha</a><button class="link hidden" type="button" data-resend style="background:none;border:0;cursor:pointer;padding:0">Reenviar e-mail de confirmação</button></div>
      <button class="btn btn-azul btn-block" type="submit">Entrar <span class="arrow">→</span></button>
      <p class="small center muted mb-0">Ainda não tem conta? <a class="link" href="/cadastro">Cadastre-se</a></p>
    </form>
  </div>
</section>
