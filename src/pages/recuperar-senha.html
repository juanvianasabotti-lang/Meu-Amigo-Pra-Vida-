<!--meta title="Recuperar senha" description="Receba um link para criar uma nova senha." script="auth" robots="noindex,follow" -->
<section class="container-narrow section" data-auth="recuperar" style="max-width:560px">
  <div class="auth-card" data-reveal="up">
    <h1>Esqueceu a senha?</h1>
    <p class="muted">Sem problema! Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
    <form class="form" novalidate data-form>
      <div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <button class="btn btn-laranja btn-block" type="submit">Enviar link</button>
      <p class="small center mb-0"><a class="link" href="/entrar">Voltar para o login</a></p>
    </form>
  </div>
</section>
